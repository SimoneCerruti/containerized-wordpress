[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

clear_env = no

ping.path = /ping
ping.response = pong

; PHP errors from FPM workers go to a dedicated file instead of nginx's
; error log via FastCGI stderr. php_value (not php_admin_value) so that
; WP_DEBUG_LOG can still redirect to wp-content/debug.log via ini_set().
; log_errors is already On in php.ini; catch_workers_output and
; decorate_workers_output are already set by the image's docker.conf.
php_value[error_log] = /var/log/wp_app/php-error.log
